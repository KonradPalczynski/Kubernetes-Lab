apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: httpd-replica
spec:
  replicas: 4
  selector:
    matchLabels:
      app: httpd
  template:
    metadata:
      name: httpd-pod
      labels:
        app: httpd
    spec:
      containers:
      - name: httpd-pod
        image: httpd:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "<html><body><h1>It works!</h1><h2>Hello world from $(hostname -i)</h2></body></html>" > /usr/local/apache2/htdocs/index.html
            exec httpd-foreground 
        ports:
          - containerPort: 80
